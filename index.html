
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title">
            <h3>Rock Paper Scissor</h3>
        </div>
    
        <!--screen 1-->
        <div class="screen1" id="screen1">
            <h4>Choose your weapon</h4>
            <div class="weapons">
                <button id="rock">🪨 Rock</button>
                <button id="paper">📄 Paper</button>
                <button id="scissor">✂️ Scissor </button>
            </div>
            <div class="scoreboard">
                <p>Won: <span id="wonScore">0 </span></p>
                <p>Lost: <span id="lostScore">0 </span></p>
                <p>Draw: <span id="drawScore">0 </span></p>
            </div>
        </div>

        <!---screen 2-->
        <div class="screen2" id="screen2">
            <p id="playerChoice">You chose: </p>
            <p id="computerChoice">Computer chose: </p>
            <p id="resultText"></p>
            <button id="retry">Retry</button>
            <button id="exit">Exit</button>
        </div>

        <!--screen 3-->
        <div class="screen3" id="screen3">
            <h4>Game Over</h4>
            <p>Matches Won: <span id="finalWon"></span></p>
            <p>Matches Lost: <span id="finalLost"></span></p>
            <p>Matches Draw: <span id="finalDraw"></span></p>
        </div>
            
        
    </div>
    <script src="script.js"></script>
</body>
</html>
